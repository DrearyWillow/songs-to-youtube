[project]
name = "songs-to-youtube"
version = "0.13.2"
description = "Application to upload songs to YouTube"
readme = "README.md"

requires-python = ">=3.15"
dependencies = [
    "mutagen>=1.48.1",
    "pathvalidate>=3.3.1",
    "psutil>=7.2.2",
    "pyside6>=6.11.2",
    "youtube-up>=0.5.6",
]

[project.scripts]
songs-to-youtube = "songs_to_youtube.main:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "mypy>=2.3.1",
    "ruff>=0.16.5",
]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "D",
    "DOC",
    "missing-copyright-notice",
    "raw-string-in-exception",
    "raise-vanilla-args",
    "docstring-missing-returns",
    "missing-trailing-comma",
    "mixed-case-variable-in-class-scope",
    "invalid-function-name",
    "unused-method-argument",
    "invalid-argument-name",
    "invalid-class-name",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

