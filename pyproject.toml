[project]
name = "songs-to-youtube"
version = "0.13.1"
description = "Application to upload songs to YouTube"
readme = "README.md"

requires-python = ">=3.13"
dependencies = [
    "mutagen>=1.47.0",
    "pathvalidate>=3.2.0",
    "psutil>=5.9.6",
    "pyside6>=6.6.1",
    "youtube-up>=0.5.0",
]

[project.scripts]
songs-to-youtube = "songs_to_youtube.main:main"

[tool.uv]
package = true
